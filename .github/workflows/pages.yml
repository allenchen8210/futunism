name: Deploy Futunism to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh after the Taiwan market closes, Monday through Friday.
    - cron: "0 8 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site/data
          cp index.html app.js styles.css _site/
          cp public/og.png _site/og.png
          curl --fail --retry 3 --silent --show-error \
            https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL \
            --output _site/data/STOCK_DAY_ALL.json
          curl --fail --retry 3 --silent --show-error \
            https://openapi.twse.com.tw/v1/exchangeReport/BWIBBU_ALL \
            --output _site/data/BWIBBU_ALL.json
          touch _site/.nojekyll
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
