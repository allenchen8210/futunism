name: Deploy Futunism to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh after the Taiwan market closes, Monday through Friday.
    - cron: "0 8 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site/data
          cp index.html app.js styles.css research.css _site/
          cp public/og.png _site/og.png
          curl --fail --retry 3 --silent --show-error \
            https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL \
            --output _site/data/STOCK_DAY_ALL.json
          curl --fail --retry 3 --silent --show-error \
            https://openapi.twse.com.tw/v1/exchangeReport/BWIBBU_ALL \
            --output _site/data/BWIBBU_ALL.json
          cp data/software-universe.json _site/data/software-universe.json
          if curl --location --fail --retry 2 --connect-timeout 10 --max-time 45 --silent --show-error \
              https://www.ishares.com/us/products/239771/ishares-expanded-tech-software-sector-etf/latest-holdings.csv \
              --output _site/data/igv-holdings.tmp \
            && curl --fail --retry 2 --connect-timeout 10 --max-time 45 --silent --show-error \
              https://openapi.twse.com.tw/v1/opendata/t187ap03_L \
              --output _site/data/twse-companies.tmp \
            && curl --fail --retry 2 --connect-timeout 10 --max-time 45 --silent --show-error \
              https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap03_O \
              --output _site/data/tpex-companies.tmp; then
            if ! node scripts/build-software-universe.mjs \
                _site/data/igv-holdings.tmp \
                _site/data/twse-companies.tmp \
                _site/data/tpex-companies.tmp \
                _site/data/software-universe.json; then
              echo "::warning::Official files were incomplete; using the verified repository snapshot."
            fi
          else
            echo "::warning::Official software universe refresh failed; using the verified repository snapshot."
          fi
          touch _site/.nojekyll
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
